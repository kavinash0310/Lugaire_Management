spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: lugaire-ecom-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_management}
    username: ${DB_USERNAME:ecommerce}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
      name: ${AUTH_BOOTSTRAP_NAME:Administrator}
      email: ${AUTH_BOOTSTRAP_EMAIL:admin@lugaire.local}
      password: ${AUTH_BOOTSTRAP_PASSWORD:change_me_for_local_development}
      role-code: ${AUTH_BOOTSTRAP_ROLE:ADMIN}
