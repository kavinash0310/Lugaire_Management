spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: lugaire-ecom-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:ecommerce_management}}?currentSchema=${DB_SCHEMA:${POSTGRES_SCHEMA:lugaire}}&sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:${POSTGRES_USER:lugaire}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:lugaire}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:${POSTGRES_SCHEMA:lugaire}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:${POSTGRES_SCHEMA:lugaire}}
    schemas: ${DB_SCHEMA:${POSTGRES_SCHEMA:lugaire}}
    create-schemas: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    bootstrap:
      enabled: ${AUTH_BOOTSTRAP_ENABLED:true}
      name: ${AUTH_BOOTSTRAP_NAME:Administrator}
      email: ${AUTH_BOOTSTRAP_EMAIL:admin@lugaire.local}
      password: ${AUTH_BOOTSTRAP_PASSWORD:lugai.re}
      role-code: ${AUTH_BOOTSTRAP_ROLE:ADMIN}
